name: Diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Debug classpath
        run: ./gradlew :app:compileDebugKotlin --info 2>&1 | grep -E "compiler args|classpath|Classpath|kotlin-stdlib|miuix|androidx.activity" | head -60 || true

      - name: Show deps
        run: ./gradlew :app:dependencies --configuration debugCompileClasspath 2>&1 | head -60 || true
